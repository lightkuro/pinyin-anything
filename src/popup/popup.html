<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pinyin Anything</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Everyday controls -->
    <main id="mainView">
      <header>
        <div class="brand">
          <ruby>拼<rt>pīn</rt></ruby>
          <h1>Pinyin Anything</h1>
        </div>
      </header>

      <section class="site">
        <label class="switch-row" for="enabled">
          <span>
            <span class="label">Annotate this site</span>
            <span class="hint" id="site">…</span>
          </span>
          <input type="checkbox" id="enabled" role="switch" />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="switch-row" for="code">
          <span>
            <span class="label">Include code blocks</span>
            <span class="hint">For lyrics and tabs shown as code</span>
          </span>
          <input type="checkbox" id="code" role="switch" />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <p class="notice" id="notice" hidden></p>
      </section>

      <section class="options">
        <div class="row">
          <span class="label" id="position-label">Position</span>
          <div class="segmented" role="radiogroup" aria-labelledby="position-label">
            <label><input type="radio" name="position" value="over" /><span>Above</span></label>
            <label><input type="radio" name="position" value="under" /><span>Below</span></label>
          </div>
        </div>

        <div class="row">
          <label class="label" for="language">Language</label>
          <select id="language">
            <option value="auto">Auto-detect</option>
            <option value="zh">Chinese only</option>
            <option value="ja">Japanese only</option>
            <option value="ko">Korean only</option>
          </select>
        </div>

        <label class="switch-row" for="meanings">
          <span>
            <span class="label">Word meanings</span>
            <span class="hint" id="meaningsHint"></span>
          </span>
          <input type="checkbox" id="meanings" role="switch" />
          <span class="switch" aria-hidden="true"></span>
        </label>

        <div class="row">
          <label class="label" for="size">Size</label>
          <div class="range">
            <input type="range" id="size" min="35" max="100" step="5" />
            <output id="sizeValue" for="size"></output>
          </div>
        </div>

        <button type="button" class="row nav" id="openSettings">
          <span class="label">Settings</span>
          <span class="hint">Cantonese, tones, downloads…</span>
          <span class="chevron" aria-hidden="true">›</span>
        </button>
      </section>
    </main>

    <!-- Set-once options -->
    <main id="settingsView" hidden>
      <header>
        <button type="button" class="back" id="closeSettings" aria-label="Back">‹</button>
        <h1>Settings</h1>
      </header>

      <h2>Chinese</h2>
      <section>
        <div class="row">
          <label class="label" for="chinese">Reading</label>
          <select id="chinese">
            <option value="pinyin">Mandarin · pinyin</option>
            <option value="jyutping">Cantonese · jyutping</option>
          </select>
        </div>
        <div class="row">
          <label class="label" for="pinyinTone">Tones</label>
          <select id="pinyinTone"></select>
        </div>
      </section>

      <h2>Japanese</h2>
      <section>
        <div class="row">
          <label class="label" for="japanese">Style</label>
          <select id="japanese">
            <option value="romaji">Romaji (nihongo)</option>
            <option value="hiragana">Hiragana (にほんご)</option>
          </select>
        </div>
      </section>

      <h2>Display</h2>
      <section>
        <div class="row">
          <label class="label" for="visibility">Show readings</label>
          <select id="visibility">
            <option value="always">Always</option>
            <option value="hover">When pointed at</option>
          </select>
        </div>
        <div class="row">
          <label class="label" for="color">Reading colour</label>
          <select id="color">
            <option value="inherit">Same as text</option>
            <option value="muted">Lighter</option>
          </select>
        </div>
      </section>

      <h2>Downloads</h2>
      <section id="packs"></section>
      <p class="credits">
        Meanings from CC-CEDICT, JMdict, Wiktionary and KENGDIC. Everything is stored and looked up on this
        computer.
      </p>

      <h2>Keyboard shortcut</h2>
      <section>
        <div class="row">
          <span>
            <span class="label">Toggle this site</span>
            <span class="hint" id="shortcutHint"></span>
          </span>
          <button type="button" id="shortcutChange">Change</button>
        </div>
      </section>
    </main>

    <template id="packRow">
      <div class="pack">
        <div class="row">
          <span>
            <span class="label"></span>
            <span class="hint"></span>
          </span>
          <button type="button" hidden></button>
        </div>
        <progress max="1" value="0" hidden></progress>
      </div>
    </template>

    <script src="popup.js"></script>
  </body>
</html>
